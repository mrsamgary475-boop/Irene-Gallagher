<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Irene</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="splash-screen" class="splash-screen">
    <div class="splash-bg"></div>
    <div class="splash-content">
      <div class="splash-avatar-wrap">
        <div class="splash-avatar-placeholder">I</div>
        <div class="splash-glow"></div>
      </div>
      <h1 class="splash-title">Irene</h1>
      <p class="splash-tagline">Your AI companion</p>
      <div class="splash-buttons">
        <button class="splash-btn secondary" onclick="enterApp('chat')">Chat</button>
        <button class="splash-btn primary" onclick="enterApp('call')">Video Call</button>
      </div>
    </div>
  </div>

  <div id="call-screen" class="call-screen hidden">
    <div class="call-bg"></div>
    <div class="call-avatar-placeholder">I</div>
    <div class="call-overlay">
      <div class="call-header">
        <div class="call-name">Irene</div>
        <div class="call-status" id="call-status">Connected</div>
      </div>
      <div class="call-moods">
        <button class="mood-pill" onclick="setCallMood('sweet', this)">Sweet</button>
        <button class="mood-pill" onclick="setCallMood('playful', this)">Playful</button>
        <button class="mood-pill" onclick="setCallMood('romantic', this)">Romantic</button>
        <button class="mood-pill active" onclick="setCallMood('intimate', this)">Intimate</button>
      </div>
      <div class="call-transcript" id="call-transcript"></div>
      <div class="call-controls">
        <button class="call-ctrl-btn" id="speaker-btn" onclick="toggleSpeaker()" title="Speaker">On</button>
        <button class="call-ctrl-btn mic-btn" id="mic-btn"
          ontouchstart="startListening(event)"
          ontouchend="stopListening(event)"
          onmousedown="startListening(event)"
          onmouseup="stopListening(event)"
          title="Hold to talk">Talk</button>
        <button class="call-ctrl-btn end-btn" onclick="endCall()" title="End call">End</button>
      </div>
      <div class="call-text-bar">
        <input id="call-text-input" class="call-text-input" type="text" placeholder="Type to Irene..." onkeydown="handleCallKey(event)" />
        <button class="call-send-mini" onclick="sendCallText()">Send</button>
      </div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <div class="header">
      <div class="header-avatar" onclick="enterApp('call')">
        <div class="header-avatar-placeholder">I</div>
      </div>
      <div class="header-info">
        <div class="header-name">Irene</div>
        <div class="header-status">online</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="enterApp('call')" title="Video call">Call</button>
        <button class="icon-btn" onclick="toggleMood()" title="Mood">Mood</button>
        <button class="icon-btn" onclick="openSettings()" title="Settings">Settings</button>
      </div>
    </div>

    <div class="mood-bar" id="mood-bar">
      <button onclick="setMood('sweet', this)">Sweet</button>
      <button onclick="setMood('playful', this)">Playful</button>
      <button onclick="setMood('romantic', this)">Romantic</button>
      <button onclick="setMood('intimate', this)">Intimate</button>
    </div>

    <div class="messages" id="messages"></div>

    <div class="quick-replies" id="quick-replies">
      <button onclick="sendQuick('Good morning')">Good morning</button>
      <button onclick="sendQuick('I missed you')">I missed you</button>
      <button onclick="sendQuick('Tell me something fun')">Something fun</button>
      <button onclick="sendQuick('How was your day?')">How was your day?</button>
    </div>

    <div class="input-bar">
      <textarea id="text-input" class="text-input" rows="1" placeholder="Message Irene..."
        onkeydown="handleKey(event)"
        oninput="autoResize(this)"></textarea>
      <button class="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <div id="settings-panel" class="panel hidden">
    <div class="panel-header">
      <h2>Settings</h2>
      <button onclick="closePanel('settings-panel')">X</button>
    </div>
    <div class="panel-body">
      <label>Your name</label>
      <input id="set-username" type="text" placeholder="Your name" />
      <label>Companion name</label>
      <input id="set-partnername" type="text" placeholder="Irene" />
      <label>Kindroid API Key</label>
      <input id="set-kindroid-key" type="password" placeholder="Kindroid API key" />
      <label>Kindroid AI ID</label>
      <input id="set-ai-id" type="text" placeholder="AI ID" />
      <button class="save-btn" onclick="saveSettings()">Save</button>
    </div>
  </div>

  <div id="overlay" class="overlay hidden" onclick="closeAllPanels()"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
