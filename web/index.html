<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0f" />
  <title>Irene — Kindroid Call</title>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="call" id="call">

    <!-- ── Full-screen looping video ── -->
    <div class="bg" id="bg">
      <video class="bg-video" id="bg-video"
        src="/irene_avatar.mp4"
        autoplay muted loop playsinline
        poster="https://images.pexels.com/photos/4442079/pexels-photo-4442079.jpeg?auto=compress&cs=tinysrgb&w=1080">
      </video>
      <div class="bg-vignette"></div>
    </div>

    <!-- ── Top bar ── -->
    <div class="top-bar">
      <!-- Left: name + status -->
      <div class="top-badge" id="top-badge">
        <span class="top-dot" id="top-dot"></span>
        <div class="top-info">
          <span class="top-name">Irene</span>
          <span class="top-sub" id="top-sub">Kindroid connected</span>
        </div>
      </div>

      <!-- Right: fullscreen -->
      <button class="fullscreen-btn" id="fullscreen-btn" onclick="toggleFullscreen()">Full screen</button>
    </div>

    <!-- ── Transcript overlay (hidden until messages arrive) ── -->
    <div class="transcript" id="transcript"></div>

    <!-- ── Bottom section ── -->
    <div class="bottom">

      <!-- Call controls row -->
      <div class="call-controls">
        <button class="cc-btn cc-start" id="call-btn" onclick="toggleCall()">Start call</button>
        <button class="cc-btn cc-dark" id="camera-btn" onclick="toggleCamera()">Camera off</button>
        <button class="cc-btn cc-dark" id="mic-status-btn">Mic ready</button>
      </div>

      <!-- Text bar -->
      <div class="text-bar">
        <input id="text-input" class="text-input"
               type="text"
               placeholder="Say something to Irene..."
               onkeydown="handleKey(event)" />

        <label class="toggle-label">
          <input type="checkbox" id="speak-toggle" checked />
          <span class="toggle-check"></span>
          <span class="toggle-text">Speak</span>
        </label>

        <label class="toggle-label">
          <input type="checkbox" id="textme-toggle" />
          <span class="toggle-check"></span>
          <span class="toggle-text">Text me</span>
        </label>

        <button class="action-btn hold-btn" id="hold-btn"
          ontouchstart="startListening(event)"
          ontouchend="stopListening(event)"
          onmousedown="startListening(event)"
          onmouseup="stopListening(event)">Hold Talk</button>

        <button class="action-btn send-btn" onclick="sendText()">Send</button>
      </div>
    </div>

  </div>

  <!-- Settings panel (accessible via long-press badge) -->
  <div id="settings-panel" class="panel hidden">
    <div class="panel-header">
      <h2>Settings</h2>
      <button onclick="closePanel()">✕</button>
    </div>
    <div class="panel-body">
      <label>Your name</label>
      <input id="set-username" type="text" placeholder="Your name" />
      <label>Companion name</label>
      <input id="set-partnername" type="text" placeholder="Irene" />
      <label>Mood</label>
      <select id="set-mood">
        <option value="sweet">Sweet</option>
        <option value="playful">Playful</option>
        <option value="romantic">Romantic</option>
        <option value="intimate" selected>Intimate</option>
      </select>
      <label>Kindroid API Key</label>
      <input id="set-kindroid-key" type="password" placeholder="API key" />
      <label>Kindroid AI ID</label>
      <input id="set-ai-id" type="text" placeholder="AI ID" />
      <button class="save-btn" onclick="saveSettings()">Save</button>
    </div>
  </div>

  <div id="overlay" class="overlay hidden" onclick="closePanel()"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
